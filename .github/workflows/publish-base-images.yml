name: Publish base service images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-base-images.yml"
      - "03_Comunicación/demo/users/**"
      - "03_Comunicación/demo/channels/**"
      - "03_Comunicación/demo/messages/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [users, channels, messages]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./03_Comunicación/demo/${{ matrix.service }}
          file: ./03_Comunicación/demo/${{ matrix.service }}/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inf326-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/inf326-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
